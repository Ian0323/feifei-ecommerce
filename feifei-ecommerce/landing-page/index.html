<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5b100c">
    <meta name="description" content="非非768 NT$3,800 療癒系問事線上預約。">
    <title>非非768｜療癒系問事預約</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #4b211b;
            background: #fffaf5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
        }
        main { text-align: center; }
        p { margin: 0 0 18px; }
        a {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 999px;
            color: #fff;
            background: #5b100c;
            text-decoration: none;
        }
    </style>
    <script>
        (function openSingleBookingEntry() {
            var redirected = false;

            function openSingleBooking() {
                if (redirected) return;
                redirected = true;
                window.location.replace("booking.html?plan=single");
            }

            // Initialize on the LIFF endpoint before moving to the next page.
            // Regular browsers and failed SDK loads still reach the active booking plan.
            var fallbackTimer = window.setTimeout(openSingleBooking, 5000);
            var sdk = document.createElement("script");
            sdk.charset = "utf-8";
            sdk.src = "https://static.line-scdn.net/liff/edge/2/sdk.js";
            sdk.onload = function() {
                if (typeof liff === "undefined") {
                    window.clearTimeout(fallbackTimer);
                    openSingleBooking();
                    return;
                }

                liff.init({ liffId: "2009821980-46y6BEMh" })
                    .then(function() {
                        window.clearTimeout(fallbackTimer);
                        openSingleBooking();
                    })
                    .catch(function(error) {
                        console.error("LIFF entry initialization failed:", error);
                        window.clearTimeout(fallbackTimer);
                        openSingleBooking();
                    });
            };
            sdk.onerror = function() {
                console.error("LIFF SDK failed to load");
                window.clearTimeout(fallbackTimer);
                openSingleBooking();
            };
            document.head.appendChild(sdk);
        })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=booking.html?plan=single"></noscript>
</head>
<body>
    <main>
        <p>正在開啟 NT$3,800 非非療癒系問事預約⋯</p>
        <a href="booking.html?plan=single">直接前往預約頁</a>
    </main>
</body>
</html>
